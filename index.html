<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Sword of Decay</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0d0d0d;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #game-root canvas {
        image-rendering: pixelated;
        /* Trava de segurança: nunca deixa o canvas maior que a janela,
           mesmo se o cálculo de zoom em main.ts errar (ex. DPR, resize
           antes do layout assentar). Mantém proporção via max-width/height. */
        max-width: 100vw !important;
        max-height: 100vh !important;
        width: auto !important;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
